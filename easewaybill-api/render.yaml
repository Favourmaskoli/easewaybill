services:
  - type: web
    name: easewaybill-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: easewaybill-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          name: easewaybill-redis
          type: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: easewaybill-redis
          type: redis
          property: port
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

databases:
  - name: easewaybill-db
    databaseName: easewaybill
    plan: free

  - name: easewaybill-redis
    type: redis
    plan: free
